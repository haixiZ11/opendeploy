appId: cn.opendeploy.app
productName: OpenDeploy
copyright: Copyright (c) 2026 qiaolei

directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - resources/**/*
  - knowledge/**/*
  # node_modules 不能整个排除 —— electron-vite 默认把 deps 列为 external,
  # 运行时还要从 app.asar/node_modules 解析。electron-builder 默认只打
  # production dependencies,devDependencies 自动跳过,无需手写 exclusion。

# bos-bridge sidecar (.NET 4.8) — must live outside asar so the .exe is
# directly callable. The main process resolves it via BOS_BRIDGE_EXE
# (set in main/index.ts when app.isPackaged).
extraResources:
  - from: bos-bridge/bin/Release/net48
    to: bos-bridge
    filter:
      - "*.exe"
      - "*.exe.config"
      - "*.dll"

asar: true
asarUnpack: []

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 开达 OpenDeploy
